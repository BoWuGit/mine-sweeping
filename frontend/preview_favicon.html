<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon 预览 - Minesweeper</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        .favicon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .favicon-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .favicon-item:hover {
            transform: translateY(-5px);
        }
        .favicon-preview {
            margin-bottom: 15px;
        }
        .favicon-preview img {
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .favicon-info {
            font-size: 14px;
            opacity: 0.9;
        }
        .back-btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Favicon 预览</h1>
        
        <div class="favicon-grid">
            <div class="favicon-item">
                <div class="favicon-preview">
                    <img src="assets/favicon.ico" alt="ICO Favicon" width="32" height="32">
                </div>
                <div class="favicon-info">
                    <strong>ICO 格式</strong><br>
                    多尺寸支持<br>
                    216 bytes
                </div>
            </div>
            
            <div class="favicon-item">
                <div class="favicon-preview">
                    <img src="assets/favicon.png" alt="PNG Favicon" width="32" height="32">
                </div>
                <div class="favicon-info">
                    <strong>PNG 格式</strong><br>
                    32x32 像素<br>
                    295 bytes
                </div>
            </div>
            
            <div class="favicon-item">
                <div class="favicon-preview">
                    <img src="assets/favicon.svg" alt="SVG Favicon" width="32" height="32">
                </div>
                <div class="favicon-info">
                    <strong>SVG 格式</strong><br>
                    矢量图形<br>
                    533 bytes
                </div>
            </div>
        </div>
        
        <div class="favicon-info" style="text-align: center; margin-bottom: 20px;">
            <p>💡 提示：这些favicon文件已经添加到游戏页面中，您可以在浏览器标签页中看到炸弹图标</p>
        </div>
        
        <a href="index.html" class="back-btn">
            🎮 返回游戏
        </a>
    </div>
</body>
</html>
